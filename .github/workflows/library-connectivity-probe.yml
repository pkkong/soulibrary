name: Inspect or stage selective library relay

on:
  push:
    branches:
      - codex/library-connectivity-recovery
    paths:
      - .github/workflows/library-connectivity-probe.yml
      - scripts/library_connectivity_probe.py
      - scripts/library_relay_release.py
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect, test preview, prepare disabled config, or stage activation/rollback
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - preview
          - prepare
          - activate
          - disable
          - retain
          - songpa-diagnose
      relay_url:
        description: Existing immutable relay preview URL for retain mode only
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: library-connectivity-probe
  cancel-in-progress: false

jobs:
  inspect-existing-project:
    if: >-
      github.repository == 'pkkong/soulibrary' &&
      (github.ref == 'refs/heads/codex/library-connectivity-recovery' ||
       (github.ref == 'refs/heads/codex/songpa-connection-fix' && github.event_name == 'workflow_dispatch') ||
       (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed probe
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read existing Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python scripts/library_connectivity_probe.py

  test-isolated-preview:
    needs: inspect-existing-project
    # Every push remains read-only; preview requires explicit manual selection.
    if: >-
      github.repository == 'pkkong/soulibrary' &&
      github.ref == 'refs/heads/codex/library-connectivity-recovery' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'preview' || inputs.mode == 'prepare')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed relay
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing parser dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline release staging guards
        run: python scripts/library_relay_release_regression_test.py

      - name: Run offline library relay regressions
        run: python scripts/library_relay_regression_test.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@64.2.0

      - name: Test isolated Seoul relay preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RELAY_RELEASE_MODE: ${{ inputs.mode }}
        run: python scripts/library_relay_release.py --mode "$RELAY_RELEASE_MODE"

  stage-production-switch:
    needs: inspect-existing-project
    # Config only: existing production deployment is never created or promoted here.
    if: >-
      github.repository == 'pkkong/soulibrary' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'activate' || inputs.mode == 'disable')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed release helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline release staging guards
        run: python scripts/library_relay_release_regression_test.py

      - name: Stage production relay switch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RELAY_RELEASE_MODE: ${{ inputs.mode }}
        run: python scripts/library_relay_release.py --mode "$RELAY_RELEASE_MODE"

  retain-relay-preview:
    needs: inspect-existing-project
    # One fixed non-production alias only; no production deploy or environment write.
    if: >-
      github.repository == 'pkkong/soulibrary' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'retain'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed release helper
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline release staging guards
        run: python scripts/library_relay_release_regression_test.py

      - name: Retain verified relay preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RELAY_RETAIN_URL: ${{ inputs.relay_url }}
        run: python scripts/library_relay_release.py --mode retain --relay-url "$RELAY_RETAIN_URL"

  diagnose-songpa-connection:
    needs: inspect-existing-project
    # Isolated diagnostic only: manual dispatch on the exact recovery branch.
    if: >-
      github.repository == 'pkkong/soulibrary' &&
      github.ref == 'refs/heads/codex/songpa-connection-fix' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'songpa-diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed diagnostic
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal diagnostic dependencies
        run: python -m pip install Flask requests

      - name: Run offline Songpa diagnostic regressions
        run: python scripts/songpa_probe_regression_test.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@64.2.0

      - name: Run one isolated Seoul Songpa diagnostic
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python scripts/songpa_connectivity_probe.py
